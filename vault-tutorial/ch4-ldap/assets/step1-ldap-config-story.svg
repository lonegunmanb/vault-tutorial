<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Step 1 LDAP config story</title><desc id="desc">Placeholder storyboard for enabling ldap auth and configuring OpenLDAP search.</desc><rect width="1200" height="675" fill="#fbf7ee"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="34" fill="#243b53">Step 1：配置 LDAP 查询路线</text><g font-family="Arial" text-anchor="middle" fill="#1f2937"><rect x="60" y="125" width="190" height="240" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="155" y="170" font-size="23">启用 auth/ldap</text><rect x="285" y="125" width="190" height="240" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><text x="380" y="170" font-size="23">People/Groups</text><rect x="510" y="125" width="190" height="240" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="605" y="170" font-size="23">vault-reader</text><rect x="735" y="125" width="190" height="240" rx="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="4"/><text x="830" y="170" font-size="23">user/group search</text><rect x="960" y="125" width="180" height="240" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="1050" y="170" font-size="23">配置完成</text></g><g stroke="#374151" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M250 245 H282"/><path d="M475 245 H507"/><path d="M700 245 H732"/><path d="M925 245 H957"/></g><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="24" fill="#374151">Vault 知道去哪查、用谁查、按什么字段查。</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#607d8b">Placeholder: replace with final hand-drawn storyboard.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#374151"/></marker></defs></svg>