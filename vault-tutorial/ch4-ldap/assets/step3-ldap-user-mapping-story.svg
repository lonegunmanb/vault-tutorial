<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Step 3 LDAP user mapping token timing story</title><desc id="desc">Placeholder storyboard showing that policy mapping applies when a new token is created.</desc><rect width="1200" height="675" fill="#fbf7ee"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="34" fill="#243b53">Step 3：旧 token 不会自动长权限</text><g font-family="Arial" text-anchor="middle" fill="#1f2937"><rect x="70" y="130" width="175" height="230" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="158" y="173" font-size="22">旧 token</text><text x="158" y="214" font-size="18">dev-read</text><rect x="280" y="130" width="175" height="230" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="368" y="173" font-size="22">补 user 映射</text><text x="368" y="214" font-size="18">bob + ops-read</text><rect x="490" y="130" width="175" height="230" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="578" y="173" font-size="22">旧 token 仍拒绝</text><rect x="700" y="130" width="175" height="230" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><text x="788" y="173" font-size="22">重新登录</text><rect x="910" y="130" width="220" height="230" rx="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="4"/><text x="1020" y="173" font-size="22">新 token</text><text x="1020" y="214" font-size="18">dev-read + ops-read</text></g><g stroke="#374151" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M245 245 H277"/><path d="M455 245 H487"/><path d="M665 245 H697"/><path d="M875 245 H907"/></g><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="24" fill="#374151">policy 是贴在 token 上的；变更映射后要重新登录。</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#607d8b">Placeholder: replace with final hand-drawn storyboard.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#374151"/></marker></defs></svg>