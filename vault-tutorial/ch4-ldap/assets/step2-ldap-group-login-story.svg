<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Step 2 LDAP group login story</title><desc id="desc">Placeholder storyboard for mapping LDAP groups to Vault policies and logging in.</desc><rect width="1200" height="675" fill="#fbf7ee"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="34" fill="#243b53">Step 2：组名换成 Vault 权限</text><g font-family="Arial" text-anchor="middle" fill="#1f2937"><rect x="50" y="125" width="170" height="230" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><text x="135" y="168" font-size="22">写 secret</text><rect x="245" y="125" width="170" height="230" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="330" y="168" font-size="22">写 policy</text><rect x="440" y="125" width="170" height="230" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="525" y="168" font-size="22">映射组</text><rect x="635" y="125" width="170" height="230" rx="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="4"/><text x="720" y="168" font-size="22">Alice 登录</text><rect x="830" y="125" width="170" height="230" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/><text x="915" y="168" font-size="22">两张通行证</text><rect x="1025" y="125" width="130" height="230" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="1090" y="168" font-size="22">Bob 被拦</text></g><g stroke="#374151" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M220 240 H242"/><path d="M415 240 H437"/><path d="M610 240 H632"/><path d="M805 240 H827"/><path d="M1000 240 H1022"/></g><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="24" fill="#374151">LDAP 负责组成员，Vault 负责把组名映射成 policy。</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#607d8b">Placeholder: replace with final hand-drawn storyboard.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#374151"/></marker></defs></svg>