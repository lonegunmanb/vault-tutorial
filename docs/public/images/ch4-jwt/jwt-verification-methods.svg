<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JWT verification methods placeholder</title>
  <desc id="desc">Placeholder for a hand drawn illustration of OIDC Discovery, JWKS, JWKS Pairs, and static keys feeding Vault.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="470" y="270" width="260" height="135" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="600" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#14532d">Vault mount</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#0f172a" stroke="#334155" stroke-width="4">
    <rect x="90" y="90" width="250" height="80" rx="14" fill="#e0f2fe"/>
    <rect x="90" y="240" width="250" height="80" rx="14" fill="#fef3c7"/>
    <rect x="90" y="390" width="250" height="80" rx="14" fill="#ede9fe"/>
    <rect x="90" y="540" width="250" height="80" rx="14" fill="#fee2e2"/>
  </g>
  <text x="215" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#075985">OIDC Discovery</text>
  <text x="215" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#78350f">JWKS URL</text>
  <text x="215" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4c1d95">JWKS Pairs</text>
  <text x="215" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#7f1d1d">Static Public Keys</text>
  <path d="M340 130 C420 160 470 240 510 275" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 280 H465" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M340 430 C420 410 460 380 500 365" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 580 C470 545 520 465 560 405" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="825" y="245" width="270" height="185" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 9"/>
  <text x="960" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">Second mount</text>
  <text x="960" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">for another issuer</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>