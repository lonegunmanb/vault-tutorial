<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes JWT auth without TokenReview placeholder</title>
  <desc id="desc">Placeholder for a hand drawn illustration showing Vault validating a Kubernetes ServiceAccount Token without TokenReview.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="95" y="210" width="290" height="190" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/>
  <text x="240" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#075985">ServiceAccount</text>
  <text x="240" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#075985">Token</text>
  <text x="240" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#075985">aud / sub / exp</text>
  <rect x="515" y="240" width="240" height="140" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="635" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#14532d">Vault</text>
  <path d="M385 305 H505" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="445" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">public key check</text>
  <rect x="850" y="190" width="250" height="120" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="975" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#7f1d1d">TokenReview API</text>
  <text x="975" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">not called</text>
  <path d="M760 275 C805 240 820 230 845 230" stroke="#dc2626" stroke-width="5" fill="none" stroke-dasharray="12 8"/>
  <line x1="820" y1="205" x2="882" y2="292" stroke="#dc2626" stroke-width="7"/>
  <line x1="882" y1="205" x2="820" y2="292" stroke="#dc2626" stroke-width="7"/>
  <rect x="395" y="475" width="410" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="600" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#78350f">Use short TTL or Kubernetes auth for revocation</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>