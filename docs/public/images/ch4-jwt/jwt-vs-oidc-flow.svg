<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JWT versus OIDC flow placeholder</title>
  <desc id="desc">Placeholder for a hand drawn illustration showing direct JWT login and OIDC browser login.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="70" y="80" width="480" height="515" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <rect x="650" y="80" width="480" height="515" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="310" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#0f172a">JWT login</text>
  <text x="890" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#0f172a">OIDC flow</text>
  <circle cx="190" cy="335" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="190" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e3a8a">Client</text>
  <rect x="365" y="285" width="120" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="425" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#14532d">Vault</text>
  <path d="M250 335 H355" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="302" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">role + JWT</text>
  <circle cx="760" cy="335" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="760" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#78350f">User</text>
  <rect x="860" y="210" width="155" height="78" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="938" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#075985">OIDC Provider</text>
  <rect x="930" y="395" width="120" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="990" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#14532d">Vault</text>
  <path d="M812 312 C845 260 850 250 858 248" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M940 292 C960 340 974 370 985 390" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="917" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">ID Token</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
