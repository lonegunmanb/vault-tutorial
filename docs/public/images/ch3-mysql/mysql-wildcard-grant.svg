<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">MySQL wildcard grant</title>
  <desc id="desc">A Vault generated user can access databases matching fooapp underscore percent, but not barapp.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .canvas { fill: #fffbeb; stroke: #cbd5e1; stroke-width: 2; rx: 24; }
      .bucket { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 14; }
      .blocked { fill: #fef2f2; stroke: #dc2626; stroke-width: 3; rx: 14; }
      .vault { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; rx: 14; }
      .label { font: 700 24px Arial, sans-serif; fill: #111827; }
      .small { font: 18px Arial, sans-serif; fill: #334155; }
      .mono { font: 18px Consolas, monospace; fill: #111827; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .cross { stroke: #dc2626; stroke-width: 7; stroke-linecap: round; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect class="canvas" x="28" y="30" width="1044" height="430" />
  <rect class="vault" x="70" y="150" width="210" height="120" />
  <text class="label" x="126" y="198">Vault</text>
  <text class="small" x="100" y="235">GRANT template</text>
  <rect class="bucket" x="410" y="90" width="190" height="130" />
  <text class="label" x="452" y="145">fooapp_a</text>
  <text class="small" x="448" y="180">SELECT OK</text>
  <rect class="bucket" x="410" y="270" width="190" height="130" />
  <text class="label" x="452" y="325">fooapp_b</text>
  <text class="small" x="448" y="360">SELECT OK</text>
  <rect class="blocked" x="780" y="180" width="190" height="130" />
  <text class="label" x="824" y="235">barapp_a</text>
  <line class="cross" x1="804" y1="200" x2="946" y2="290" />
  <line class="cross" x1="946" y1="200" x2="804" y2="290" />
  <path class="line" d="M280 185 C335 135 365 125 410 135" />
  <path class="line" d="M280 235 C335 300 365 325 410 335" />
  <text class="mono" x="310" y="248">`fooapp\_%`.*</text>
  <rect class="note" x="80" y="340" width="300" height="58" />
  <text class="small" x="101" y="376">Use base64 to avoid shell backticks.</text>
</svg>
